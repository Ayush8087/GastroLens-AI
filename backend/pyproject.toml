[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "restaurant-research-backend"
version = "0.1.0"
description = "FastAPI foundation for the Barcelona restaurant research agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.142,<0.143",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.13,<5",
    "trafilatura>=2.0,<3",
    "pymupdf>=1.26,<2",
    "openai>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
